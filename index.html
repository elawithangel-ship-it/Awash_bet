<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awash Bet</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b151e;
            color: #ffffff;
            padding-bottom: 70px;
        }

        .header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .balance-card {
            background: #1e293b;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #334155;
            font-size: 14px;
            font-weight: 600;
            color: #4ade80;
        }

        .nav-tabs {
            display: flex;
            background: #0f172a;
            padding: 10px;
            gap: 10px;
            overflow-x: auto;
            border-bottom: 1px solid #1e293b;
        }

        .tab-btn {
            background: #1e293b;
            color: #94a3b8;
            border: none;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: #0284c7;
            color: #ffffff;
        }

        .container {
            padding: 15px;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .game-card {
            background: #1e293b;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #334155;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 12px;
            color: #94a3b8;
        }

        .teams {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .odds-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .odd-btn {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            color: #ffffff;
            cursor: pointer;
        }

        .odd-btn:hover {
            border-color: #38bdf8;
        }

        .odd-label {
            font-size: 11px;
            color: #94a3b8;
            display: block;
            margin-bottom: 4px;
        }

        .odd-value {
            font-size: 14px;
            font-weight: bold;
            color: #38bdf8;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #38bdf8;
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            background: #0284c7;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .action-btn:active {
            opacity: 0.9;
        }

        .notice-box {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid #0284c7;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #38bdf8;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .telebirr-no {
            font-size: 18px;
            font-weight: bold;
            color: #4ade80;
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin: 10px 0;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">⚽ Awash Bet</div>
        <div class="balance-card">ሒሳብ: <span id="balance">0.00</span> ETB</div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('games')">ጨዋታዎች</button>
        <button class="tab-btn" onclick="switchTab('deposit')">ገንዘብ ማስገቢያ</button>
        <button class="tab-btn" onclick="switchTab('withdraw')">ገንዘብ ማውጫ</button>
    </div>

    <div class="container">
        <!-- Games Section -->
        <div id="games" class="section active">
            <div class="game-card">
                <div class="game-header">
                    <span>እንግሊዝ ፕሪሚየር ሊግ</span>
                    <span>ዛሬ 16:00</span>
                </div>
                <div class="teams">
                    <span>አርሰናል</span>
                    <span>vs</span>
                    <span>ቼልሲ</span>
                </div>
                <div class="odds-grid">
                    <div class="odd-btn">
                        <span class="odd-label">1 (አርሰናል)</span>
                        <span class="odd-value">2.10</span>
                    </div>
                    <div class="odd-btn">
                        <span class="odd-label">X (አኩል)</span>
                        <span class="odd-value">3.20</span>
                    </div>
                    <div class="odd-btn">
                        <span class="odd-label">2 (ቼልሲ)</span>
                        <span class="odd-value">3.10</span>
                    </div>
                </div>
            </div>

            <div class="game-card">
                <div class="game-header">
                    <span>ስፓኒሽ ላሊጋ</span>
                    <span>ዛሬ 18:30</span>
                </div>
                <div class="teams">
                    <span>ሪያል ማድሪድ</span>
                    <span>vs</span>
                    <span>ባርሴሎና</span>
                </div>
                <div class="odds-grid">
                    <div class="odd-btn">
                        <span class="odd-label">1 (ሪያል)</span>
                        <span class="odd-value">2.25</span>
                    </div>
                    <div class="odd-btn">
                        <span class="odd-label">X (አኩል)</span>
                        <span class="odd-value">3.40</span>
                    </div>
                    <div class="odd-btn">
                        <span class="odd-label">2 (ባርሳ)</span>
                        <span class="odd-value">2.80</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Deposit Section -->
        <div id="deposit" class="section">
            <div class="notice-box">
                ገንዘብ ለማስገባት ከታች ባለው የቴሌብር ቁጥር ገንዘብ ገቢ ያድርጉ፤ ከዚያ የግብይት ማረጋገጫ ቁጥር (Transaction ID) ያስገቡ።
            </div>
            
            <div style="text-align: center; margin-bottom: 15px;">
                <label>የቴሌብር ቁጥር</label>
                <div class="telebirr-no">0912845687</div>
            </div>

            <div class="form-group">
                <label>የገንዘብ መጠን (ETB)</label>
                <input type="number" placeholder="ለምሳሌ: 100">
            </div>

            <div class="form-group">
                <label>የግብይት ቁጥር (Transaction ID)</label>
                <input type="text" placeholder="ለምሳሌ: TXN12345678">
            </div>

            <button class="action-btn" onclick="alert('የገንዘብ ማስገባት ጥያቄዎ ተልኳል! በጥቂት ደቂቃዎች ውስጥ ይረጋገጣል።')">ገንዘብ አስገባ</button>
        </div>

        <!-- Withdraw Section -->
        <div id="withdraw" class="section">
            <div class="form-group">
                <label>የቴሌብር ስልክ ቁጥርዎ</label>
                <input type="tel" placeholder="09........">
            </div>

            <div class="form-group">
                <label>የሚያወጡት ገንዘብ መጠን (ETB)</label>
                <input type="number" placeholder="ከ 50 ETB ጀምሮ">
            </div>

            <button class="action-btn" onclick="alert('የገንዘብ ማውጣት ጥያቄዎ ተልኳል!')">ገንዘብ አውጣ</button>
        </div>
    </div>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
