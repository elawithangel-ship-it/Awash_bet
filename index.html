<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Awash Bet</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b151e;
      color: #ffffff;
      padding-bottom: 70px;
    }

    /* Top Navigation */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background-color: #0d1b2a;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      color: #00e676;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .balance-box {
      background-color: #1b263b;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      border: 1px solid #00e676;
    }

    .profile-icon {
      width: 32px;
      height: 32px;
      background-color: #00e676;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: bold;
    }

    /* Category Buttons */
    .categories {
      display: flex;
      gap: 10px;
      padding: 12px 16px;
      overflow-x: auto;
    }

    .cat-btn {
      padding: 10px 16px;
      border-radius: 12px;
      border: none;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    .cat-sports { background-color: #00e676; color: #000; }
    .cat-slots { background-color: #ff6d00; color: #fff; }
    .cat-casino { background-color: #d50000; color: #fff; }

    /* Sports Match Card */
    .section-title {
      padding: 12px 16px 6px;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .view-all {
      color: #00e676;
      font-size: 14px;
      text-decoration: none;
    }

    .match-card {
      margin: 10px 16px;
      background-color: #162436;
      border-radius: 12px;
      padding: 14px;
    }

    .odds-row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .odd-box {
      flex: 1;
      background-color: #0d1b2a;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #23354d;
    }

    .odd-box span {
      display: block;
      font-size: 12px;
      color: #8b9bb4;
    }

    .odd-box strong {
      color: #ffffff;
      font-size: 16px;
    }

    /* Game Grid */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 10px 16px;
    }

    .game-card {
      background-color: #162436;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    .game-card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      display: block;
    }

    .game-title {
      padding: 8px;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background-color: #0d1b2a;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #23354d;
    }

    .nav-item {
      text-align: center;
      color: #8b9bb4;
      text-decoration: none;
      font-size: 11px;
    }

    .nav-item.active {
      color: #00e676;
    }

    .nav-item div {
      font-size: 18px;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="logo">AWASH BET</div>
    <div class="user-info">
      <div class="balance-box">0.00 ETB</div>
      <div class="profile-icon">👤</div>
    </div>
  </div>

  <!-- Categories -->
  <div class="categories">
    <button class="cat-btn cat-sports">⚽ SPORTS</button>
    <button class="cat-btn cat-slots">🎰 SLOTS</button>
    <button class="cat-btn cat-casino">🎲 LIVE CASINO</button>
  </div>

  <!-- Match Bets -->
  <div class="section-title">
    <span>Match Result</span>
  </div>
  <div class="match-card">
    <div style="font-size: 13px; color: #8b9bb4; margin-bottom: 6px;">Premier League</div>
    <div style="font-size: 15px; font-weight: bold; margin-bottom: 10px;">Arsenal vs Chelsea</div>
    <div class="odds-row">
      <div class="odd-box"><span>1</span><strong>2.10</strong></div>
      <div class="odd-box"><span>X</span><strong>3.40</strong></div>
      <div class="odd-box"><span>2</span><strong>3.10</strong></div>
    </div>
  </div>

  <!-- Casino Games -->
  <div class="section-title">
    <span>Casino</span>
    <a href="#" class="view-all">View all</a>
  </div>
  <div class="game-grid">
    <div class="game-card">
      <img src="https://via.placeholder.com/150/ff6d00/ffffff?text=Crazy+Tiki" alt="Game">
      <div class="game-title">Crazy Tiki</div>
    </div>
    <div class="game-card">
      <img src="https://via.placeholder.com/150/d50000/ffffff?text=Bonbon" alt="Game">
      <div class="game-title">Bonbon Kingdom</div>
    </div>
  </div>

  <!-- Live Casino -->
  <div class="section-title">
    <span>Live Casino</span>
    <a href="#" class="view-all">View all</a>
  </div>
  <div class="game-grid">
    <div class="game-card">
      <img src="https://via.placeholder.com/150/00e676/000000?text=Roulette" alt="Game">
      <div class="game-title">Midnight Roulette</div>
    </div>
    <div class="game-card">
      <img src="https://via.placeholder.com/150/00b0ff/ffffff?text=Dragon+Tiger" alt="Game">
      <div class="game-title">Dragon Tiger</div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <a href="#" class="nav-item active">
      <div>🏠</div>
      Home
    </a>
    <a href="#" class="nav-item">
      <div>🚀</div>
      Crash
    </a>
    <a href="#" class="nav-item">
      <div>📋</div>
      Bet slip
    </a>
    <a href="#" class="nav-item">
      <div>⚽</div>
      Sports
    </a>
    <a href="#" class="nav-item">
      <div>🍔</div>
      Menu
    </a>
  </div>

</body>
</html>
